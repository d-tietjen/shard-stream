[workspace]
members = [
    "crates/ordered-segment-map",
    "crates/shard-stream-bench",
    "crates/shard-stream-client",
    "crates/shard-stream-control",
    "crates/shard-stream-core",
    "crates/shard-stream-engine",
    "crates/shard-stream-grpc",
    "crates/shard-stream-h3",
    "crates/shard-stream-kafka",
    "crates/shard-stream-protocol",
    "crates/shard-stream-server",
    "crates/shard-stream-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Devon Tietjen <devon@eden.dev>"]
homepage = "https://github.com/d-tietjen/shard-stream"
license = "Apache-2.0"
repository = "https://github.com/d-tietjen/shard-stream"
rust-version = "1.90"

[workspace.dependencies]
axum = "0.8"
blake3 = "1.8"
bytes = "1.10"
bytes-handoff = "1.3.1"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
eden_logger = { version = "0.1.1", default-features = false, features = ["log-info", "log-warn", "log-error", "log-internal", "fast-telemetry-context"] }
fast-telemetry = "0.7.1"
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
ordered-segment-map = { path = "crates/ordered-segment-map", version = "0.1.0" }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3"
indexmap = "2.14"
kafka-protocol = { version = "0.17", features = ["messages_enums"] }
prost = "0.14"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
shard-stream-core = { path = "crates/shard-stream-core", version = "0.1.0" }
shard-stream-control = { path = "crates/shard-stream-control", version = "0.1.0" }
shard-stream-engine = { path = "crates/shard-stream-engine", version = "0.1.0" }
shard-stream-kafka = { path = "crates/shard-stream-kafka", version = "0.1.0" }
shard-stream-protocol = { path = "crates/shard-stream-protocol", version = "0.1.0" }
shard-stream-storage = { path = "crates/shard-stream-storage", version = "0.1.0" }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
strip = false
codegen-units = 1
